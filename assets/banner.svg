<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Thiago Raphael, Desenvolvedor Front-End e Analista de Dados">
  <style>
    .sans { font-family: 'Bricolage Grotesque', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: 'IBM Plex Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; }
    .cursor { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .bar { animation: grow 2.4s ease-out both; transform-origin: left; }
    @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1C1E31" stroke-width="1"/>
    </pattern>
    <linearGradient id="fade" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#0E0F1A" stop-opacity="1"/>
      <stop offset="0.55" stop-color="#0E0F1A" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#0E0F1A" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="320" rx="16" fill="#0E0F1A"/>
  <rect width="1200" height="320" rx="16" fill="url(#grid)"/>
  <rect width="1200" height="320" rx="16" fill="url(#fade)"/>

  <!-- tag -->
  <text x="64" y="84" class="mono" font-size="18" fill="#C6F135" letter-spacing="1">~/thiagoraphael</text>

  <!-- name -->
  <text x="64" y="160" class="sans" font-size="72" font-weight="700" fill="#F4F4F7" letter-spacing="-2">Thiago Raphael</text>

  <!-- role -->
  <text x="64" y="212" class="mono" font-size="24" fill="#B7B9CC">front-end <tspan fill="#C6F135">+</tspan> dados <tspan fill="#C6F135">+</tspan> design<tspan class="cursor" fill="#C6F135">_</tspan></text>

  <rect class="bar" x="64" y="244" width="120" height="4" rx="2" fill="#C6F135"/>
  <text x="64" y="282" class="mono" font-size="15" fill="#6E7191">Barbacena, MG · React · Next.js · TypeScript · Python</text>

  <g transform="translate(790 70) rotate(-5)">
    <rect width="150" height="190" rx="12" fill="#13152A" stroke="#2A2D45"/>
    <rect x="14" y="14" width="122" height="14" rx="4" fill="#2A2D45"/>
    <rect x="14" y="40" width="122" height="70" rx="6" fill="#23263D"/>
    <rect x="14" y="122" width="100" height="8" rx="4" fill="#4A4E6B"/>
    <rect x="14" y="140" width="80" height="8" rx="4" fill="#4A4E6B"/>
    <rect x="14" y="158" width="92" height="8" rx="4" fill="#4A4E6B"/>
  </g>
  <!-- right side: mini story card mock -->
  <g transform="translate(905 40) rotate(4)">
    <rect width="190" height="240" rx="14" fill="#16182A" stroke="#2A2D45"/>
    <rect x="18" y="18" width="154" height="130" rx="8" fill="#C6F135" opacity="0.9"/>
    <rect x="18" y="18" width="154" height="130" rx="8" fill="url(#grid)" opacity="0.5"/>
    <rect x="18" y="164" width="110" height="10" rx="5" fill="#F4F4F7"/>
    <rect x="18" y="184" width="76" height="8" rx="4" fill="#6E7191"/>
    <rect x="18" y="210" width="154" height="6" rx="3" fill="#2A2D45"/>
    <rect x="18" y="210" width="98" height="6" rx="3" fill="#C6F135"/>
  </g>
</svg>
